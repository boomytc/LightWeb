<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Boom 的个人网页入口，汇总作品集、个人介绍和公开项目。">
    <link rel="icon" href="assets/images/profile-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles/site.css">
    <link rel="canonical" href="./">
    <title>Boom | LightWeb</title>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="返回个人主页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>LightWeb</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="pages/projects/">作品集</a>
          <a href="pages/about/">个人介绍</a>
          <a href="pages/resume/">个人简历</a>
        </nav>
      </header>

      <main>
        <section class="hero" aria-labelledby="home-title">
          <div>
            <p class="eyebrow">Portfolio first</p>
            <h1 id="home-title">Boom 的个人网页入口</h1>
            <p class="lede">
              把公开作品、项目路径和能力方向放在最前面，再逐步补充个人介绍、简历和文章。
            </p>
            <div class="hero-actions" aria-label="主要入口">
              <a class="action-link" href="pages/projects/">查看作品集</a>
              <a class="action-link secondary" href="pages/about/">个人介绍</a>
            </div>
          </div>

          <figure class="profile-art">
            <img src="assets/images/profile-mark.svg" alt="LightWeb 个人站点标记">
            <figcaption>后续可以替换为真实头像、个人标识或项目照片。</figcaption>
          </figure>
        </section>

        <section class="route-band" aria-labelledby="routes-title">
          <p class="section-label" id="routes-title">站点路径</p>
          <ul class="route-list">
            <li>
              <a href="pages/projects/">
                <span class="route-title">作品集</span>
                <span class="route-desc">集中展示公开项目、产品原型、本地工具和可演示交付成果。</span>
                <span class="route-arrow" aria-hidden="true">→</span>
              </a>
            </li>
            <li>
              <a href="pages/about/">
                <span class="route-title">个人介绍</span>
                <span class="route-desc">整理背景、关注方向、长期项目和联系方式。</span>
                <span class="route-arrow" aria-hidden="true">→</span>
              </a>
            </li>
            <li>
              <a href="pages/resume/">
                <span class="route-title">个人简历</span>
                <span class="route-desc">保留一份适合在线浏览的履历页面，后续可补充 PDF 下载。</span>
                <span class="route-arrow" aria-hidden="true">→</span>
              </a>
            </li>
            <li>
              <a href="pages/blog/">
                <span class="route-title">博客</span>
                <span class="route-desc">暂时保留为后续文章入口，等内容足够后再扩展。</span>
                <span class="route-arrow" aria-hidden="true">→</span>
              </a>
            </li>
          </ul>
        </section>
      </main>

      <footer class="site-footer">
        <span>LightWeb · Static personal pages</span>
      </footer>
    </div>
  </body>
</html>
